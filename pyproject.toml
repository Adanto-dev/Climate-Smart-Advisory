[project]
name = "climate-smart-advisory"
version = "0.1.0"
description = "Agentic climate-smart advisory drafting for agricultural extension offices (MCP + LangGraph, human-in-the-loop)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["mcp>=2.0", "langgraph>=1.0", "httpx>=0.27", "uv>=0.4"]   # uv provides `uvx`, used to run the borrowed mcp-server-time in isolation
[project.optional-dependencies]
dev = ["pytest>=8"]
[project.scripts]
csa = "csa.cli:main"
[tool.setuptools]
packages = ["csa"]
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.pytest.ini_options]
testpaths = ["tests"]
